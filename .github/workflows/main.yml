name: PHP Composer

on:
  push:
    # Both lanes, because both get released from: a version with no suffix is cut
    # from `main`, and a prerelease from `dev`. A branch CI never looks at is a
    # branch that can be tagged on a commit nothing verified.
    branches: [ "main", "dev" ]
    # A tag is what Packagist publishes. Defining `branches` alone excludes tag
    # refs, so without this every `v*` push — and so every published version —
    # would carry no CI record at all.
    tags: [ "v*" ]
  pull_request:
    # The base branch, so a merge into either lane is checked before it lands
    # rather than after.
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # One entry, not three: require.php is ^8.4, so the 8.2 and 8.3 legs could
      # never get past `composer install`. Add newer releases here as they ship.
      matrix:
        php: [ "8.4" ]

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: Composer guesses the root package version from tags and
        # branches, and a shallow clone leaves that guess wrong.
        fetch-depth: 0

    - name: Pin the root package version
      # Branch builds only. `dev-` plus the ref name is how a branch is spelled
      # as a version, and a slash is not valid in one — that part still holds.
      # On a tag build the ref name is the tag, so the same line would pin
      # `dev-v0.0.1-alpha1`: Composer accepts it, and it is meaningless. The env
      # var wins over the VCS guess, so a tag build leaves it unset and lets the
      # tag answer instead — which it can, now that a prerelease tag is a version
      # Composer can read.
      if: github.ref_type != 'tag'
      run: |
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        ROOT_VERSION="dev-${BRANCH//\//-}"
        echo "COMPOSER_ROOT_VERSION=$ROOT_VERSION" >> "$GITHUB_ENV"
        echo "Root version pinned to $ROOT_VERSION"

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        # A library commits no composer.lock, so the manifest is what the cache
        # key can hash.
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run the check suite
      # The same nine checks a release is gated behind locally — PHP syntax, an
      # AST parse of the same files, the write-back scan of `src/` and `config/`,
      # `composer validate --strict`, platform requirements, the workflow YAML,
      # PHPStan, Pint and PHPUnit — rather than the three `composer test` covers.
      # CI must not be weaker than the gate a tag is cut behind, and the YAML
      # check is the one that reads this file.
      # A tool the runner is missing drops to a skip; `--require-all` is what
      # would make that a failure instead.
      run: composer checks

  pgcat-live:

    runs-on: ubuntu-latest

    # A second job rather than a step in the one above: this is the only test
    # that needs a container, and the unit suite must stay runnable without
    # Docker. The test it runs skips unless the fixture below is there, and
    # `PGCAT_LIVE_REQUIRED` is what turns a fixture that never arrived into a
    # failure — a green job with five skips would pin nothing.
    name: pgcat pool probe (live)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pin the root package version
      if: github.ref_type != 'tag'
      run: |
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        ROOT_VERSION="dev-${BRANCH//\//-}"
        echo "COMPOSER_ROOT_VERSION=$ROOT_VERSION" >> "$GITHUB_ENV"

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Write the pooler's own file
      # One pool, and the console's own credentials, because the fixture is what
      # the package is handed: `config_path` is the file the process runs on.
      # The backend address is deliberately one nothing listens on — the probe
      # asks what the pooler holds, not whether the database behind it is up.
      run: |
        mkdir -p "$RUNNER_TEMP/pgcat"
        cat > "$RUNNER_TEMP/pgcat/pgcat.toml" <<'TOML'
        [general]
        host = "0.0.0.0"
        port = 6432
        admin_username = "pgcAdmin"
        admin_password = "s3cret"
        pool_mode = "transaction"
        enable_prometheus_exporter = false

        [pools.writer_db_1]
        pool_mode = "transaction"

        [pools.writer_db_1.users.0]
        username = "postgres"
        password = "postgres"
        pool_size = 1

        [pools.writer_db_1.shards.0]
        servers = [["127.0.0.1", 5432, "primary"]]
        database = "postgres"
        TOML

    - name: Start pgcat from its published image
      # The tag and the digest together: the tag says which release this is,
      # the digest is what actually runs, so a moved tag cannot change what the
      # fixture measures. v1.2.0 is the newest release, and the one whose
      # `SHOW POOLS` names the pool column `database`.
      run: |
        docker run --detach --name pgcat-live \
          --publish 127.0.0.1:6432:6432 \
          --volume "$RUNNER_TEMP/pgcat/pgcat.toml:/etc/pgcat/pgcat.toml:ro" \
          ghcr.io/postgresml/pgcat:v1.2.0@sha256:627761f6dcbc8c0d17809445d7441518e2452c6d4fbdcc2a9986871d9e3e1176
        for attempt in $(seq 1 30); do
          if php -r 'exit(@fsockopen("127.0.0.1", 6432) === false ? 1 : 0);'; then
            echo "pgcat is listening"
            exit 0
          fi
          sleep 1
        done
        docker logs pgcat-live
        exit 1

    - name: Hold the probe against it
      # `--filter` names the class, and the grep is what keeps "No tests
      # executed" from being read as a pass: PHPUnit exits 0 when a filter
      # matches nothing, and a job that pinned nothing would still be green.
      env:
        PGCAT_LIVE_CONFIG: ${{ runner.temp }}/pgcat/pgcat.toml
        PGCAT_LIVE_REQUIRED: '1'
      run: |
        set -o pipefail
        vendor/bin/phpunit --colors=never --filter PoolProbeAgainstPgcatTest | tee "$RUNNER_TEMP/pgcat-live.log"
        grep -Eq '^OK \([1-9][0-9]* test' "$RUNNER_TEMP/pgcat-live.log"

    - name: Show the pooler's own log
      if: failure()
      run: docker logs pgcat-live || true

    - name: Stop the pooler
      # `|| true` because a run that failed before the container existed would
      # otherwise fail twice, and the second failure would hide the first.
      if: always()
      run: docker rm --force pgcat-live || true
